<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>PS4 + PS5 融合 Portal</title>
<style>
body{background:#11131a;color:#e7ecf5;font-family:system-ui,sans-serif;margin:0;padding:32px 24px;line-height:1.6;max-width:760px;margin-left:auto;margin-right:auto}
h1{font-size:26px;margin:0 0 4px}
p.sub{color:#9aa6bd;margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
a.card{display:block;background:#1b2030;border:1px solid #2c3447;border-radius:14px;padding:22px;text-decoration:none;color:inherit;transition:border-color .15s,background .15s}
a.card:hover{border-color:#5b8cff;background:#222a3e}
a.card b{display:block;font-size:19px;color:#7fa9ff;margin-bottom:6px}
a.card small{color:#9aa6bd;font-size:13px}
a.card .tag{display:inline-block;font-size:11px;background:#243456;color:#9dbcf5;border-radius:5px;padding:2px 8px;margin-top:12px}
a.tools{display:block;text-align:center;color:#8e9ab2;font-size:13px;margin-top:28px;text-decoration:none}
a.tools:hover{color:#7fa9ff}
code{background:#0c0f16;padding:2px 6px;border-radius:4px;color:#a8e6a3}
</style>
</head>
<body>
<h1>PS4 + PS5 融合 Portal</h1>
<p class="sub">连接热点 <code>PS4_PS5_PORTAL</code> 后，从下方选择你的主机。</p>

<div class="grid">
  <a class="card" href="/">
    <b>PS5</b>
    <small>打开主机「用户指南」即自动触发，无需输入地址。</small>
    <span class="tag">自动识别固件 · 7.00–13.60</span>
  </a>
  <a class="card" href="/ps4/">
    <b>PS4</b>
    <small>浏览器打开 <code>192.168.4.1/ps4/</code> 自动识别系统版本，无需手动选择。</small>
    <span class="tag">一键破解 · 5.05 / 7.00–14.02</span>
  </a>
</div>

<a class="tools" href="/status.html">系统监控 · payload 升级 / 管理 →</a>

</html>
