; ESP32-S3 N16R8 (16 MB flash + 8 MB octal PSRAM)
; PS4 + PS5 WebKit exploit host fusion firmware.

[platformio]
default_envs = esp32s3-n16r8

[env:esp32s3-n16r8]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions_16mb.csv
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -Os
    -DBOARD_HAS_PSRAM
    -DCONFIG_ESP32S3_SPIRAM_SUPPORT=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0
    -DUSB_MSC_EXFATHAX=1

; Upstream payload trees are staged into data/ by tools/stage_payloads.py.
; Run that script before "pio run -t uploadfs".
extra_scripts =
